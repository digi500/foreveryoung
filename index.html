  function renderTabs() {
    const nav = document.getElementById('topics-nav');
    const titles = topicTitles[currentLang];
    nav.innerHTML = titles.map((title, idx) => `
      <button class="tab-btn ${idx === currentIndex ? 'active' : ''}" onclick="showTopic(${idx})" id="tab-${idx}">
        ${title}
      </button>
    `).join('');
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem('foreveryoung_lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = (lang === 'tr') ? 'Forever Young — Yapay Zekâ Sempozyumu' : 'Forever Young — AI Research Symposium';
    
    document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    
    renderTabs();
    showTopic(currentIndex);
  }

  function showTopic(index) {
    currentIndex = index;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', i === index);
    });

    const file = files[index];
    const displayFilename = (index === 0) 
      ? (currentLang === 'en' ? 'README.en.md' : 'README.md')
      : (currentLang === 'en' ? file.name.replace('.md', '.en.md') : file.name);

    const docElem = document.getElementById('current-doc-name');
    if (docElem) docElem.textContent = displayFilename;
    
    const tagElem = document.getElementById('meta-tag');
    if (tagElem) {
      tagElem.textContent = (index === 0) 
        ? (currentLang === 'tr' ? 'Genel Tanıtım' : 'Overview Document')
        : (index === 7 ? (currentLang === 'tr' ? 'Sonuç Bildirgesi' : 'Executive Synthesis') : (currentLang === 'tr' ? 'Sempozyum Diyaloğu' : 'Symposium Dialogue'));
    }

    let html = file.content[currentLang];
    
    // Add GitHub links at the bottom of content
    const isReadme = (index === 0);
    const discussUrl = "https://github.com/digi500/foreveryoung/discussions";
    const fileUrl = isReadme
      ? `https://github.com/digi500/foreveryoung/blob/main/${displayFilename}`
      : `https://github.com/digi500/foreveryoung/blob/main/tartisma/${displayFilename}`;

    const labelDiscuss = (currentLang === 'tr') 
      ? "Bu konu hakkında GitHub'da tartışmaya katıl →" 
      : "Join discussion on GitHub →";
    const labelSource = (currentLang === 'tr') 
      ? `GitHub'daki kaynak dosya (${displayFilename}) →` 
      : `View source on GitHub (${displayFilename}) →`;

    html += `
      <div class="action-row">
        <a href="${discussUrl}" target="_blank" rel="noopener" class="btn-discuss">💬 ${labelDiscuss}</a>
        <a href="${fileUrl}" target="_blank" rel="noopener" class="btn-source">📄 ${labelSource}</a>
      </div>
    `;

    document.getElementById('content-body').innerHTML = html;
  }

  // Initialize
  // Tarayıcı dilini veya kayıtlı kullanıcı tercihini algıla
  let detectedLang = 'en';
  try {
    const savedLang = localStorage.getItem('foreveryoung_lang');
    if (savedLang === 'tr' || savedLang === 'en') {
      detectedLang = savedLang;
    } else {
      const browserLang = (navigator.language || (navigator.languages && navigator.languages[0]) || 'tr').toLowerCase();
      detectedLang = browserLang.startsWith('tr') ? 'tr' : 'en';
